<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>Page introuvable — Observatoire des projets étudiants</title>
<style>
@font-face{font-family:"TheSans";src:url("/fonts/TheSansOsF-Plain.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"TheSans";src:url("/fonts/TheSansOsF-ExtraBold.woff2") format("woff2");font-weight:800;font-display:swap}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:"TheSans",system-ui,sans-serif;background:#00857F;color:#fff;text-align:center;padding:24px}
.code{font-size:clamp(80px,18vw,140px);font-weight:800;line-height:1;letter-spacing:-.04em}
.bar{width:60px;height:5px;background:#CF0063;border-radius:3px;margin:18px 0}
h1{font-size:clamp(22px,4vw,32px);font-weight:800;margin:0}
p{color:rgba(255,255,255,.85);font-size:17px;max-width:46ch;margin:10px 0 26px}
a{display:inline-flex;align-items:center;border-radius:999px;padding:13px 26px;background:#fff;color:#00857F;text-decoration:none;font-weight:800;font-size:16px}
a:hover{background:#EAF6F5}
</style>
</head>
<body>
<div class="code">404</div>
<div class="bar"></div>
<h1>Cette page n'existe pas</h1>
<p>La page que vous cherchez a peut-être été déplacée ou supprimée.</p>
<a href="/">Retour à l'Observatoire des projets étudiants</a>
</body>
</html>
