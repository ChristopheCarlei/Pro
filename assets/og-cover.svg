  <circle cx="980" cy="-60" r="340" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="80"/>
  <circle cx="980" cy="-60" r="220" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="60"/>
  <!-- Texte principal -->
  <text x="80" y="200" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="64" fill="white" letter-spacing="-2">Observatoire des projets</text>
  <text x="80" y="278" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="64" fill="white" letter-spacing="-2">étudiants</text>
